<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Blog CMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="cms-body">
    <div class="cms-container">
        <header class="cms-header">
            <h1>📂 Categories</h1>
            <div class="header-actions">
                <a href="{{ url_for('cms') }}" class="btn btn-secondary">← Back to CMS</a>
            </div>
        </header>

        <!-- Add New Category -->
        <div class="post-form" style="margin-bottom: 24px;">
            <h3 style="margin-bottom: 16px;">Add New Category</h3>
            <form method="POST" style="display: flex; gap: 12px; align-items: flex-end;">
                <input type="hidden" name="action" value="add">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label for="name">Category Name</label>
                    <input type="text"
                           id="name"
                           name="name"
                           class="form-control"
                           placeholder="e.g., Travel, Photography, Technology"
                           required>
                </div>
                <button type="submit" class="btn btn-primary">Add Category</button>
            </form>
        </div>

        <!-- Categories List -->
        <div class="post-form">
            <h3 style="margin-bottom: 16px;">Existing Categories</h3>
            {% if categories %}
                <div class="categories-list">
                    {% for category in categories %}
                    <div class="category-item">
                        <form method="POST" class="category-edit-form">
                            <input type="hidden" name="action" value="edit">
                            <input type="hidden" name="category_id" value="{{ category.id }}">
                            <input type="text"
                                   name="name"
                                   value="{{ category.name }}"
                                   class="category-name-input"
                                   required>
                            <div class="category-meta">
                                <span class="category-count">{{ category.post_count }} post{{ 's' if category.post_count != 1 else '' }}</span>
                            </div>
                            <div class="category-actions">
                                <button type="submit" class="btn btn-small btn-primary">Save</button>
                                <button type="button"
                                        class="btn btn-small btn-danger"
                                        onclick="deleteCategory({{ category.id }}, '{{ category.name }}', {{ category.post_count }})">
                                    Delete
                                </button>
                            </div>
                        </form>
                    </div>
                    {% endfor %}
                </div>
            {% else %}
                <div class="empty-state" style="padding: 40px 20px; grid-column: auto;">
                    <p>No categories yet. Add your first category above!</p>
                </div>
            {% endif %}
        </div>
    </div>

    <!-- Hidden delete form -->
    <form id="deleteForm" method="POST" style="display: none;">
        <input type="hidden" name="action" value="delete">
        <input type="hidden" name="category_id" id="deleteCategoryId">
    </form>

    <script>
        function deleteCategory(id, name, postCount) {
            if (postCount > 0) {
                alert(`Cannot delete "${name}": ${postCount} post(s) are using this category.\n\nPlease reassign those posts to a different category first.`);
                return;
            }

            if (!confirm(`Are you sure you want to delete "${name}"?`)) {
                return;
            }

            document.getElementById('deleteCategoryId').value = id;
            document.getElementById('deleteForm').submit();
        }
    </script>

    <style>
        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 16px;
        }

        .category-edit-form {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .category-name-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }

        .category-name-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        .category-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-count {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 4px 10px;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .category-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        @media (max-width: 768px) {
            .category-edit-form {
                flex-direction: column;
                align-items: stretch;
            }

            .category-name-input {
                width: 100%;
            }

            .category-actions {
                margin-left: 0;
                justify-content: flex-end;
            }
        }
    </style>
</body>
</html>
